<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시트·열 화살표 관계 대시보드 · Dorms' Chronicle</title>
  <link rel="stylesheet" href="./assets/chronicle-theme.css">
  <link rel="stylesheet" href="./assets/data-guide-nav.css?v=wrap-small">
  <style>
    :root {
      --bg: var(--chronicle-paper);
      --surface: var(--chronicle-surface);
      --sheet-head: #f1f3f4;
      --sheet-grid: #dadce0;
      --border: var(--chronicle-line);
      --text: var(--chronicle-ink);
      --muted: var(--chronicle-muted);
      --catalog: #1a73e8;
      --actors: #188038;
      --geo: #d97706;
      --rel: #7c3aed;
      --danger: #d93025;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: var(--chronicle-button-radius);
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #1e293b;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover { background: var(--chronicle-tint); }
    .btn[aria-pressed="true"], .btn-primary {
      background: var(--chronicle-green);
      border-color: var(--chronicle-green);
      color: #fff;
    }
    .btn-primary:hover, .btn[aria-pressed="true"]:hover { background: var(--chronicle-green); }

    .shell {
      max-width: 1640px;
      margin: 0 auto;
      padding: 14px 18px 36px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Global Cross-Sheet Value Search */
    .global-search-bar {
      position: sticky;
      top: 8px;
      z-index: 40;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .global-search-input {
      flex: 1 1 12rem;
      min-width: 0;
      border: 0;
      font-size: 0.88rem;
      background: transparent;
      color: #0f172a;
    }
    .global-search-meta {
      font-size: 0.77rem;
      color: #64748b;
      white-space: nowrap;
    }
    .global-search-meta:empty, #btn-clear-global[hidden] { display: none; }
    #sync-status { margin: 0; color: var(--muted); font-size: 0.85rem; }
    .global-results {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .global-results[hidden] { display: none; }
    .global-res-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .global-res-tab {
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
    }
    .global-res-tab[aria-pressed="true"] {
      background: #1a73e8;
      border-color: #1a73e8;
      color: #fff;
    }
    .global-res-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 310px), 1fr));
      gap: 8px;
      max-height: 290px;
      overflow-y: auto;
    }
    .global-res-item {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
    }
    .global-res-item.is-active { border-color: #1a73e8; background: #eff6ff; }
    .global-res-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .global-res-sheet { color: var(--chronicle-ink); font-size: 0.95rem; }
    .global-res-top a { white-space: nowrap; font-size: 0.8rem; }
    .global-res-matches { list-style: none; margin: 0; padding: 0; }
    .global-res-match {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 5fr);
      align-items: baseline;
      gap: 8px;
      width: 100%;
      padding: 5px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .global-res-match:hover, .global-res-match:focus-visible { background: var(--chronicle-tint); }
    .global-res-column { color: var(--chronicle-green); font-size: 0.85rem; font-weight: 700; overflow-wrap: anywhere; }
    .global-res-snippet {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      overflow-wrap: anywhere;
      font-size: 0.82rem;
    }
    .global-res-record { margin: 2px 0 0 5px; color: var(--muted); font-size: 0.78rem; overflow-wrap: anywhere; }
    .global-res-snippet mark {
      background: #fef08a;
      color: #0f172a;
      padding: 0 2px;
      border-radius: 3px;
    }
    /* Controls bar */
    .control-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .legend-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      font-size: 0.77rem;
      color: #475569;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .swatch-line {
      display: inline-block;
      width: 22px;
      height: 0;
      border-top: 2.5px solid currentColor;
    }
    .swatch-line.is-dashed { border-top-style: dashed; }
    .control-btns, .relation-modes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    /* Spreadsheet Canvas */
    .canvas-wrap {
      position: relative;
      background: #fbfaf7;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 18px;
      overflow: hidden;
    }
    .arrow-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }
    .arrow-labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }
    .arrow-label-btn {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 999px;
      border: 1.5px solid var(--edge-color, #475569);
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s, background 0.12s, opacity 0.12s;
    }
    .arrow-label-btn:hover {
      transform: translate(-50%, -50%) scale(1.05);
      background: #fff;
      z-index: 30;
    }
    .arrow-label-btn.is-active {
      background: var(--edge-color, #0f172a);
      color: #fff;
      z-index: 32;
    }
    .arrow-label-btn.is-dim { opacity: 0.22; }
    .arrow-label-btn small { font-weight: 600; opacity: 0.8; font-size: 0.65rem; }

    .rows-stack {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 64px;
      width: 100%;
    }
    .sheet-row-group {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      justify-content: space-between;
      width: 100%;
    }

    /* Mini Google Sheet Card */
    .mini-sheet {
      flex: var(--col-weight, 3) 1 0;
      min-width: 0;
      background: #fff;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
      transition: opacity 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .mini-sheet.is-dim .sheet-tab-bar { background: var(--sheet-head); }
    .mini-sheet.is-dim .sheet-dot { opacity: 0.5; }
    .mini-sheet.is-selected {
      border-color: var(--sheet-color);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--sheet-color) 14%, transparent);
      opacity: 1;
    }
    .sheet-tab-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 2px 6px;
      padding: 6px 9px;
      background: color-mix(in srgb, var(--sheet-color) 10%, #ffffff);
      border-bottom: 1px solid #e2e8f0;
    }
    .sheet-tab-btn {
      display: flex;
      min-width: 0;
      white-space: nowrap;
      align-items: center;
      gap: 6px;
      background: none;
      border: 0;
      padding: 0;
      font-size: 0.84rem;
      font-weight: 800;
      color: #0f172a;
      cursor: pointer;
    }
    .sheet-tab-btn span { overflow: hidden; text-overflow: ellipsis; }
    .sheet-tab-btn .sheet-dot, .sheet-tab-btn small { flex: none; }
    .sheet-tab-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 4px; }
    .sheet-tab-actions .sheet-full-btn { padding: 3px 7px; white-space: nowrap; }
    .sheet-dot {
      width: 9px;
      height: 9px;
      border-radius: 3px;
      background: var(--sheet-color);
      display: inline-block;
    }
    .sheet-tab-btn small, .sheet-tab-status { font-size: 0.75rem; font-weight: 600; color: var(--muted); }
    .sheet-tab-status { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 8px; padding-inline-start: 15px; }
    .sheet-tab-status .linked-count { color: #166534; }
    .sheet-tab-status .match-count { color: #854d0e; }
    .sheet-ext {
      display: grid;
      place-items: center;
      min-width: 24px;
      min-height: 24px;
      font-size: 0.85rem;
      color: #475569;
      text-decoration: none;
      padding: 2px 6px;
      border-radius: 5px;
    }
    .sheet-ext:hover { background: rgba(15, 23, 42, 0.07); }

    .mini-grid-wrap { overflow: hidden; }
    .mini-grid {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.69rem;
      table-layout: fixed;
    }
    .mini-grid th {
      position: relative;
      background: var(--sheet-head);
      border-right: 1px solid var(--sheet-grid);
      border-bottom: 1.5px solid #cbd5e1;
      padding: 0;
      text-align: left;
      white-space: nowrap;
    }
    .mini-grid th:last-child, .mini-grid td:last-child { border-right: 0; }
    .col-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 5px 5px;
      background: none;
      border: 0;
      font-size: 0.69rem;
      font-weight: 700;
      color: #1f2937;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
    }
    .col-btn span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .col-btn:hover { background: #e8eaed; }
    .mini-grid th.is-col-hit .col-btn {
      background: color-mix(in srgb, var(--sheet-color) 18%, #ffffff);
      color: #0f172a;
    }
    .mini-grid th.is-col-active .col-btn {
      background: var(--sheet-color);
      color: #fff;
    }
    .col-letter {
      font-size: 0.62rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .mini-grid th.is-col-active .col-letter { color: rgba(255,255,255,0.75); }
    .key-badge {
      font-size: 0.58rem;
      font-weight: 800;
      padding: 1px 3px;
      border-radius: 3px;
    }
    .key-pk { background: #fef3c7; color: #92400e; }
    .key-fk { background: #dbeafe; color: #1d4ed8; }
    .mini-grid td {
      padding: 4px 5px;
      border-right: 1px solid #eef0f2;
      border-bottom: 1px solid #eef0f2;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 760px) {
      .mini-grid th.map-key-col { width: 52px; }
    }
    .map-key-cell { display: flex; align-items: center; gap: 4px; }
    .map-key-cell > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .mini-grid tr:last-child td { border-bottom: 0; }
    .mini-grid td.rn {
      background: #f8f9fa;
      color: #94a3b8;
      text-align: center;
      font-family: ui-monospace, monospace;
      font-size: 0.66rem;
      width: 24px;
    }

    /* Bottom Live Inspector */
    .inspector {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .ins-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .ins-head h2 { margin: 0; font-size: 1rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ins-relation { margin: 4px 0 0; font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
    .rel-strip { display: flex; flex-wrap: wrap; gap: 6px; }
    .rel-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      font-size: 0.76rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #1e293b;
      cursor: pointer;
    }
    .rel-chip.is-active { background: #eff6ff; border-color: #2563eb; color: #1e3a8a; }
    .rel-chip.is-junction { border-style: dashed; border-color: #a78bfa; background: #f5f3ff; }
    .rel-chip.is-junction.is-active { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    .rel-chip small { opacity: 0.78; }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .shape-type-options, .trace-sheet-options { display: flex; flex-wrap: wrap; gap: 4px; }
    .search-box {
      flex: 1 1 260px;
      max-width: 440px;
      padding: 7px 12px;
      font-size: 0.82rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
    }
    .pin-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 9px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      font-size: 0.8rem;
      color: #1e3a8a;
    }
    .live-table-wrap {
      max-height: 520px;
      overflow: auto;
      border: 1px solid #dadce0;
      border-radius: 10px;
    }
    .live-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.79rem;
    }
    .live-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      text-align: left;
      padding: 7px 10px;
      background: var(--sheet-head);
      border-right: 1px solid var(--sheet-grid);
      border-bottom: 1.5px solid #cbd5e1;
      color: #374151;
      font-weight: 700;
      white-space: nowrap;
    }
    .live-table td {
      padding: 6px 10px;
      border-right: 1px solid #eef0f2;
      border-bottom: 1px solid #eef0f2;
      white-space: nowrap;
      color: #1f2937;
    }
    .live-table tr:hover td { background: #f8fafc; }
    .row-ext {
      font-family: ui-monospace, monospace;
      font-weight: 700;
      color: #1a73e8;
      text-decoration: none;
    }
    .row-ext:hover { text-decoration: underline; }
    .fk-link {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      padding: 2px 7px;
      font-size: 0.75rem;
      border-radius: 5px;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
      cursor: pointer;
    }
    .fk-link:hover { background: #dbeafe; }
    .fk-link small { color: #475569; font-size: 0.7rem; }
    .fk-warn { color: var(--danger); font-weight: 700; }
    .live-table tbody tr { cursor: pointer; }
    .live-table tbody tr.is-traced td { background: #eff6ff !important; }
    .mini-grid tbody tr { cursor: pointer; }
    .mini-grid tbody tr:hover td { background: #f1f5f9; }
    .mini-grid tbody tr.is-origin-row td {
      background: #dbeafe !important;
      color: #0f172a;
      font-weight: 700;
    }
    .mini-grid tbody tr.is-linked-row td {
      background: #f0fdf4;
      color: #0f172a;
    }
    .mini-grid tbody tr.is-linked-row:hover td { background: #dcfce7; }
    .mini-grid tbody tr.is-search-row td {
      background: #fefce8;
      color: #0f172a;
    }
    .mini-grid tbody tr.is-search-row:hover td { background: #fef9c3; }
    .mini-grid td mark {
      background: #fde047;
      color: #0f172a;
      padding: 0 2px;
      border-radius: 3px;
      font-weight: 700;
    }
    .canvas-trace-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 10px;
      background: #eff6ff;
      border: 1.5px solid #93c5fd;
      font-size: 0.8rem;
      color: #1e3a8a;
      position: fixed;
      inset-inline: max(12px, calc((100% - 1000px) / 2));
      bottom: max(12px, env(safe-area-inset-bottom));
      max-height: min(9rem, 35vh);
      overflow: auto;
      overflow-wrap: anywhere;
      box-shadow: 0 4px 20px rgba(30, 58, 138, 0.14);
      z-index: 50;
    }
    .canvas-trace-bar[hidden] { display: none; }
    body:has(.canvas-trace-bar:not([hidden])) .shell { padding-bottom: 10rem; }
    .trace-card {
      border: 1.5px solid #93c5fd;
      background: #f8fbff;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .trace-card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .trace-card-head h3 {
      margin: 0;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .trace-groups {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
      gap: 10px;
    }
    .trace-group {
      background: #fff;
      border: 1px solid #dbeafe;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .trace-group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 800;
      color: #1e3a8a;
    }
    .trace-group-head span.dir-tag {
      font-size: 0.66rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
    }
    .trace-group-head span.dir-tag.is-jn {
      background: #f5f3ff;
      color: #6d28d9;
    }
    .trace-items {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .trace-node {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 7px;
      font-size: 0.74rem;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      cursor: pointer;
    }
    .trace-node:hover { border-color: #1a73e8; background: #eff6ff; color: #1d4ed8; }
    .trace-node small { color: #64748b; font-size: 0.68rem; }
    .map-prev-btn {
      display: inline-grid;
      place-items: center;
      flex: none;
      min-width: 24px;
      min-height: 24px;
      margin-inline-end: 5px;
      padding: 1px 3px;
      font: inherit;
      border-radius: 5px;
      border: 1px solid #fcd34d;
      background: #fffbeb;
      cursor: pointer;
      vertical-align: middle;
    }
    .map-key-cell .map-prev-btn { margin-inline-end: 0; }
    .map-key-cell .map-prev-btn:focus-visible { outline-offset: -2px; }
    .map-prev-btn:hover { background: #fef3c7; border-color: #f59e0b; }
    dialog.map-modal {
      width: min(820px, 94vw);
      max-height: 90vh;
      padding: 0;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.25);
      background: #fff;
      overflow: hidden;
    }
    dialog.map-modal::backdrop {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
    }
    dialog.map-modal {width:min(1060px,96vw);overflow:auto;background:#fffdf7;border:0}
    .schema-shape-footer {padding:0 28px 22px;color:#3c5947;font-size:14px}
    .full-sheet-modal {
      width: min(1180px, calc(100% - 24px));
      max-height: calc(100dvh - 32px);
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 24px 60px #0f172a40;
    }

    function colLetter(index) {
      let label = '';
      for (let number = index + 1; number > 0; number = Math.floor((number - 1) / 26)) {
        label = String.fromCharCode(65 + (number - 1) % 26) + label;
      }
      return label;
    }

    function parseCSV(text) {
      const rows = [];
      let row = [], cell = '', quoted = false;
      const src = text.replace(/^\uFEFF/, '');
      for (let i = 0; i < src.length; i++) {
        const ch = src[i];
        if (quoted) {
          if (ch === '"' && src[i + 1] === '"') { cell += '"'; i++; }
          else if (ch === '"') quoted = false;
          else cell += ch;
        } else if (ch === '"') {
          quoted = true;
        } else if (ch === ',' || ch === '\n' || ch === '\r') {
          row.push(cell); cell = '';
          if (ch !== ',') { rows.push(row); row = []; if (ch === '\r' && src[i + 1] === '\n') i++; }
        } else {
          cell += ch;
        }
      }
      if (cell || row.length) { row.push(cell); rows.push(row); }
      return rows.filter(r => r.some(v => v.trim() !== ''));
    }

    let jsonpSeq = 0;
    function fetchTabJSONP(tab, gid) {
      return new Promise((resolve, reject) => {
        const cb = '__clioGvizCb_' + (++jsonpSeq) + '_' + Date.now();
        const script = document.createElement('script');
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error(`${tab} JSONP timeout`));
        }, 12000);
        function cleanup() {
          clearTimeout(timer);
          delete window[cb];
          script.remove();
        }
        window[cb] = resp => {
          cleanup();
          try {
            const table = resp?.table;
            if (!table) return reject(new Error(`${tab} empty gviz table`));
            const hdrs = table.cols.map(c => String(c.label || c.id || '').trim());
            if (tab === '공간' && hdrs[0] === 'ㅇ') hdrs[0] = '공간ID';
            const records = (table.rows || []).map(r => {
              const obj = {};
              hdrs.forEach((h, i) => {
                if (!h) return;
                const cell = r.c?.[i];
                const raw = cell ? (cell.f ?? cell.v ?? '') : '';
                obj[h] = String(raw ?? '').trim();
              });
              return obj;
            }).filter(obj => Object.values(obj).some(v => v !== ''));
            resolve({ headers: hdrs.filter(Boolean), records });
          } catch (e) {
            reject(e);
          }
        };
        script.onerror = () => {
          cleanup();
          reject(new Error(`${tab} JSONP script error`));
        };
        script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?gid=${gid}&headers=1&tqx=out:json;responseHandler:${cb}`;
        document.head.appendChild(script);
      });
    }

    async function fetchTab(tab) {
      const gid = SHEET_GIDS[tab];
      // 1) Primary: exact same export CSV endpoint & credentials: 'omit' used by sheets.js
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${gid}`;
        const res = await fetch(url, { credentials: 'omit', cache: 'no-store' });
        if (!res.ok) throw new Error(`${tab} HTTP ${res.status}`);
        const text = await res.text();
        if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
          throw new Error(`${tab} returned HTML instead of CSV`);
        }
        const rows = parseCSV(text);
        if (!rows.length) return { headers: [], records: [] };
        const hdrs = rows[0].map(h => h.trim());
        if (tab === '공간' && hdrs[0] === 'ㅇ') hdrs[0] = '공간ID';
        const records = rows.slice(1).map(r => {
          const obj = {};
          hdrs.forEach((h, i) => { if (h) obj[h] = (r[i] ?? '').trim(); });
          return obj;
        });
        return { headers: hdrs.filter(Boolean), records };
      } catch (primaryErr) {
        // 2) Fallback: JSONP via <script> tag (works even when opened directly via file://)
        return fetchTabJSONP(tab, gid);
      }
    }

    async function loadAllSheets() {
      const status = document.getElementById('sync-status');
      let ok = 0;
      await Promise.all(ALL_TABS.map(async tab => {
        try {
          const { headers, records } = await fetchTab(tab);
          state.headers[tab] = headers;
          state.data[tab] = records;
          ok++;
        } catch (err) {
          console.error(tab, err);
        }
      }));
      status.hidden = ok === ALL_TABS.length;
      if (!status.hidden) {
        status.textContent = ok
          ? `일부 시트를 불러오지 못했습니다. ${ok}/${ALL_TABS.length}개 시트를 검색할 수 있습니다.`
          : '시트를 불러오지 못했습니다. 페이지를 새로고침해 주세요.';
      }
      render();
    }

    function computeArrowStats() {
      const pkMaps = new Map();
      for (const s of CORE_SHEETS) {
        const m = new Map();
        (state.data[s.tab] || []).forEach((row, idx) => {
          const v = row[s.pk];
          if (v && !m.has(v)) m.set(v, { idx, label: row[s.labelCol] || v });
        });
        pkMaps.set(s.tab, m);
      }
      const stats = ARROWS.map(a => {
        if (a.kind === 'junction') {
          const rows = state.data[a.viaTab] || [];
          return { ...a, count: rows.length, filled: rows.length, matched: rows.length, missing: 0 };
        }
        const targetSet = new Set((state.data[a.to] || []).map(r => r[a.toCol]).filter(Boolean));
        let filled = 0, matched = 0;
        for (const r of state.data[a.from] || []) {
          const v = r[a.fromCol];
          if (!v) continue;
          filled++;
          if (targetSet.has(v)) matched++;
        }
        return { ...a, count: matched, filled, matched, missing: filled - matched };
      });
      return { stats, pkMaps };
    }

    function getActiveArrows(stats, tracedInfo) {
      if (tracedInfo) return stats.filter(arrow => tracedInfo.arrowIds.has(arrow.id));
      if (state.selectedArrowId) return stats.filter(a => a.id === state.selectedArrowId);
      if (state.mode === 'all') return stats;
      return stats.filter(a => {
        if (state.selectedCol) {
          return (a.from === state.selectedTab && a.fromCol === state.selectedCol) ||
                 (a.to === state.selectedTab && a.toCol === state.selectedCol);
        }
        return a.from === state.selectedTab || a.to === state.selectedTab;
      });
    }

    const isMapKeyColumn = col => col === '지도참조키' || col === '배경지도키';

    function mapPreviewButton(key) {
      const label = esc(key + ' 지도 미리보기');
      return `<button type="button" class="map-prev-btn" data-preview-map-key="${esc(key)}" aria-label="${label}" title="${label}" aria-haspopup="dialog">🗺</button>`;
    }

    function fullSheetButton(tab) {
      return `<button type="button" class="btn sheet-full-btn" data-open-full-sheet="${esc(tab)}"
        aria-haspopup="dialog" aria-controls="full-sheet-modal" aria-label="${esc(tab)} 전체 표">전체 표</button>`;
    }

    function render() {
      const { stats, pkMaps } = computeArrowStats();
      const tracedInfo = state.tracedRow
        ? collectConnectedRowsBySheet(state.tracedRow.tab, state.tracedRow.origIdx, pkMaps)
        : null;
      const activeArrows = getActiveArrows(stats, tracedInfo);
      const activeArrowIds = new Set(activeArrows.map(a => a.id));
      const fkByCol = new Map(stats.filter(a => a.kind === 'fk').map(a => [`${a.from}::${a.fromCol}`, a]));

      const traceBar = document.getElementById('canvas-trace-bar');
      if (state.tracedRow && tracedInfo) {
        const tTab = state.tracedRow.tab;
        const tIdx = state.tracedRow.origIdx;
        const tRow = (state.data[tTab] || [])[tIdx];
        const linkedSheets = [...tracedInfo.bySheet.entries()];
        const totalLinkedSheets = linkedSheets.filter(([tab, rows]) => tab !== tTab || rows.size > 1).length;
        const totalLinkedRows = linkedSheets.reduce((sum, [, rows]) => sum + rows.size, -1);
        traceBar.hidden = false;
        traceBar.innerHTML = `
          <span>🔗 <strong>${esc(tTab)} #${tIdx + 2} · ${esc(tRow ? rowDisplayLabel(tTab, tRow) : '')}</strong> · 직접 연결 <strong>${totalLinkedSheets}개 시트 · ${totalLinkedRows}행</strong></span>
          <span style="display:flex;gap:6px">
            <a class="btn" href="${esc(sheetUrl(tTab, tIdx + 2))}" target="_blank" rel="noopener noreferrer">구글 시트 행 열기 ↗</a>
            <button type="button" class="btn btn-primary" id="btn-clear-canvas-trace">추적 해제</button>
          </span>`;
      } else {
        traceBar.hidden = true;
      }

      const connectedTabs = new Set([state.selectedTab]);
      if (tracedInfo) {
        connectedTabs.clear();
        tracedInfo.bySheet.forEach((_, k) => connectedTabs.add(k));
      }
      const connectedCols = new Set();
      activeArrows.forEach(a => {
        connectedTabs.add(a.from);
        connectedTabs.add(a.to);
        connectedCols.add(`${a.from}::${a.fromCol}`);
        connectedCols.add(`${a.to}::${a.toCol}`);
      });

      // Global cross-sheet value search
      const gq = state.globalQuery.trim().toLowerCase();
      const globalHitsByTab = new Map();
      const allGlobalHits = [];
      if (gq && !tracedInfo) {
        for (const tab of ALL_TABS) {
          const rows = state.data[tab] || [];
          rows.forEach((row, origIdx) => {
            const matchedCols = [];
            for (const [col, val] of Object.entries(row)) {
              if (val && String(val).toLowerCase().includes(gq)) {
                matchedCols.push({ col, val: String(val) });
              }
            }
            if (matchedCols.length) {
              const item = { tab, origIdx, rowNum: origIdx + 2, row, matchedCols };
              allGlobalHits.push(item);
              if (!globalHitsByTab.has(tab)) globalHitsByTab.set(tab, []);
              globalHitsByTab.get(tab).push(item);
            }
          });
        }
      }
      renderGlobalResults(gq, allGlobalHits, globalHitsByTab, tracedInfo);

      document.getElementById('meta-counts').textContent = `관계 ${activeArrows.length}/${stats.length}`;
      document.getElementById('btn-mode-focus').setAttribute('aria-pressed', String(state.mode === 'focus'));
      document.getElementById('btn-mode-all').setAttribute('aria-pressed', String(state.mode === 'all'));

      document.getElementById('rows-stack').innerHTML = SHEET_ROWS.map(rowGroup => `
        <div class="sheet-row-group">
          ${rowGroup.map(s => {
            const rows = state.data[s.tab] || [];
            const tracedMap = tracedInfo ? tracedInfo.bySheet.get(s.tab) : null;
            const tracedEntries = tracedMap ? [...tracedMap.values()] : [];
            const searchHits = gq ? (globalHitsByTab.get(s.tab) || []) : [];
            const isOriginSheet = state.tracedRow && state.tracedRow.tab === s.tab;

            let previewEntries = [];
            let extraCount = 0;
            let extraLabel = '';
            if (tracedInfo) {
              previewEntries = tracedEntries.slice(0, 6).map(e => ({
                row: rows[e.origIdx], origIdx: e.origIdx, rowClass: e.isOrigin ? 'is-origin-row' : 'is-linked-row', note: e.note
              })).filter(e => e.row);
              extraCount = Math.max(0, tracedEntries.length - previewEntries.length);
              extraLabel = `외 연결 행 ${extraCount}건 더 있음`;
            } else if (gq) {
              previewEntries = searchHits.slice(0, 6).map(h => ({
                row: h.row, origIdx: h.origIdx, rowClass: 'is-search-row', note: '검색 일치'
              }));
              extraCount = Math.max(0, searchHits.length - previewEntries.length);
              extraLabel = `외 검색 결과 ${extraCount}건 더 있음`;
            } else {
              previewEntries = rows.slice(0, 3).map((row, idx) => ({
                row, origIdx: idx, rowClass: '', note: ''
              }));
            }

            const isSel = tracedInfo ? isOriginSheet : gq ? searchHits.length > 0 : s.tab === state.selectedTab;
            const isDim = tracedInfo ? !tracedEntries.length : gq ? !searchHits.length : state.mode === 'focus' && !connectedTabs.has(s.tab);
            return `
              <article class="mini-sheet ${isSel ? 'is-selected' : ''} ${isDim ? 'is-dim' : ''}" style="--sheet-color:${s.color};--col-weight:${s.cols.length}" data-sheet="${esc(s.tab)}">
                <div class="sheet-tab-bar">
                  <button type="button" class="sheet-tab-btn" data-select-sheet="${esc(s.tab)}">
                    <i class="sheet-dot"></i>
                    <span>${esc(s.tab)}</span>
                    <small>${rows.length.toLocaleString()}행</small>
                  </button>
                  <div class="sheet-tab-actions">
                    ${fullSheetButton(s.tab)}
                    <a class="sheet-ext" href="${esc(sheetUrl(s.tab))}" target="_blank" rel="noopener noreferrer" aria-label="${esc(s.tab)} 시트 열기" title="구글 시트 열기">↗</a>
                  </div>
                  ${(!isOriginSheet && tracedEntries.length) || (gq && searchHits.length) ? `<div class="sheet-tab-status">
                    ${!isOriginSheet && tracedEntries.length ? `<span class="linked-count">연결 ${tracedEntries.length}행</span>` : ''}
                    ${gq && searchHits.length ? `<span class="match-count">검색 ${searchHits.length}행</span>` : ''}
                  </div>` : ''}
                </div>
                <div class="mini-grid-wrap">
                  <table class="mini-grid">
                    <thead>
                      <tr>
                        <th style="width:24px;text-align:center;color:#94a3b8;font-size:0.65rem">#</th>
                        ${s.cols.map((col, ci) => {
                          const isPk = s.pk === col;
                          const isFk = fkByCol.has(`${s.tab}::${col}`);
                          const colKey = `${s.tab}::${col}`;
                          const isColAct = isSel && state.selectedCol === col;
                          const isColHit = connectedCols.has(colKey);
                          return `
                            <th class="${isColAct ? 'is-col-active' : isColHit ? 'is-col-hit' : ''} ${isMapKeyColumn(col) ? 'map-key-col' : ''}" data-col-anchor="${esc(colKey)}">
                              <button type="button" class="col-btn" data-select-sheet="${esc(s.tab)}" data-select-col="${esc(col)}" title="${esc(col)}">
                                <span class="col-letter">${colLetter(ci)}</span>
                                ${isPk ? '<span class="key-badge key-pk">PK</span>' : ''}${isFk ? '<span class="key-badge key-fk">FK</span>' : ''}
                                <span>${esc(col)}</span>
                              </button>
                            </th>`;
                        }).join('')}
                      </tr>
                    </thead>
                    <tbody>
                      ${previewEntries.length ? previewEntries.map(e => `
                        <tr class="${e.rowClass}" data-mini-row-tab="${esc(s.tab)}" data-mini-row-idx="${e.origIdx}" title="클릭하면 이 행과 연결된 행들을 각 시트 아래에 표시합니다${e.note ? ' (' + esc(e.note) + ')' : ''}">
                          <td class="rn">${e.origIdx + 2}</td>
                          ${s.cols.map(col => {
                            const rawVal = e.row[col] || '';
                            const cellHtml = (gq && rawVal) ? highlightMatch(rawVal, gq) : esc(rawVal || '—');
                            if (isMapKeyColumn(col) && rawVal && pkMaps.get('지도도형')?.has(rawVal)) {
                              return `<td title="${esc(rawVal)}"><div class="map-key-cell">${mapPreviewButton(rawVal)}<span>${cellHtml}</span></div></td>`;
                            }
                            return `<td title="${esc(rawVal)}">${cellHtml}</td>`;
                          }).join('')}
                        </tr>
                      `).join('') + (extraCount > 0 ? `<tr><td colspan="${s.cols.length + 1}" style="text-align:center;color:${tracedInfo ? '#166534' : '#854d0e'};background:${tracedInfo ? '#f0fdf4' : '#fefce8'};font-weight:700;font-size:0.68rem">${extraLabel} (시트 제목 클릭)</td></tr>` : '')
                      : `<tr><td colspan="${s.cols.length + 1}" style="text-align:center;color:#94a3b8;padding:8px">${tracedInfo ? '연결된 행 없음' : gq ? '검색 결과 없음' : '표시할 행 없음'}</td></tr>`}
                    </tbody>
                  </table>
                </div>
              </article>`;
          }).join('')}
        </div>
      `).join('');

      drawArrows(stats, activeArrowIds);
      renderInspector(stats, pkMaps, tracedInfo, gq, globalHitsByTab);
      bindEvents();
    }

    function drawArrows(allStats, activeArrowIds) {
      const wrap = document.querySelector('.canvas-wrap');
      const svg = document.getElementById('arrow-layer');
      const labelHost = document.getElementById('arrow-labels');

      requestAnimationFrame(() => {
        const wRect = wrap.getBoundingClientRect();
        if (!wRect.width || !wRect.height) return;
        svg.setAttribute('viewBox', `0 0 ${wRect.width} ${wRect.height}`);
        svg.setAttribute('width', wRect.width);
        svg.setAttribute('height', wRect.height);

        const defs = `
          <defs>
            <marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#1a73e8" />
            </marker>
            <marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#188038" />
            </marker>
            <marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
            </marker>
            <marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
            </marker>
            <marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#d93025" />
            </marker>
          </defs>`;

        const markerFor = (color, missing) => {
          if (missing) return 'url(#ah-red)';
          if (color === '#1a73e8') return 'url(#ah-blue)';
          if (color === '#188038') return 'url(#ah-green)';
          if (color === '#d97706') return 'url(#ah-amber)';
          return 'url(#ah-purple)';
        };

        const paths = [];
        const labelsHtml = [];
        const placedLabels = [];

        const toRender = allStats.filter(a => activeArrowIds.has(a.id));

        toRender.forEach((a, idx) => {
          const fEl = wrap.querySelector(`[data-col-anchor="${CSS.escape(a.from + '::' + a.fromCol)}"]`);
          const tEl = wrap.querySelector(`[data-col-anchor="${CSS.escape(a.to + '::' + a.toCol)}"]`);
          if (!fEl || !tEl) return;

          const f = fEl.getBoundingClientRect();
          const t = tEl.getBoundingClientRect();
          const stroke = a.missing ? '#d93025' : a.color;
          const dash = a.kind === 'junction' ? 'stroke-dasharray="6 4"' : '';
          const isExact = state.selectedArrowId === a.id;
          const sw = isExact ? 2.8 : 1.9;

          let d = '', lx = 0, ly = 0;

          if (a.from === a.to && a.fromCol === a.toCol) {
            // Self-loop arrow (e.g., 관계 on 사건.사건ID)
            const cx = (f.left + f.right) / 2 - wRect.left;
            const ty = f.top - wRect.top;
            d = `M ${cx - 12} ${ty} C ${cx - 38} ${ty - 44}, ${cx + 38} ${ty - 44}, ${cx + 12} ${ty - 2}`;
            lx = cx;
            ly = ty - 34;
          } else {
            const fcX = (f.left + f.right) / 2 - wRect.left;
            const fcY = (f.top + f.bottom) / 2 - wRect.top;
            const tcX = (t.left + t.right) / 2 - wRect.left;
            const tcY = (t.top + t.bottom) / 2 - wRect.top;

            const sameRow = Math.abs(fcY - tcY) < 40;
            const spread = ((idx % 5) - 2) * 14;

            if (sameRow) {
              // Arc above or below the row
              const arcH = 32 + (idx % 3) * 16;
              const yStart = f.top - wRect.top;
              const yEnd = t.top - wRect.top;
              const yMid = Math.min(yStart, yEnd) - arcH;
              d = `M ${fcX.toFixed(1)} ${yStart.toFixed(1)} C ${fcX.toFixed(1)} ${yMid.toFixed(1)}, ${tcX.toFixed(1)} ${yMid.toFixed(1)}, ${tcX.toFixed(1)} ${yEnd.toFixed(1)}`;
              lx = (fcX + tcX) / 2;
              ly = yMid + 8;
            } else {
              const goingDown = tcY > fcY;
              const y1 = (goingDown ? f.bottom : f.top) - wRect.top;
              const y2 = (goingDown ? t.top : t.bottom) - wRect.top;
              const midY = (y1 + y2) / 2 + spread;
              d = `M ${fcX.toFixed(1)} ${y1.toFixed(1)} C ${fcX.toFixed(1)} ${midY.toFixed(1)}, ${tcX.toFixed(1)} ${midY.toFixed(1)}, ${tcX.toFixed(1)} ${y2.toFixed(1)}`;
              lx = (fcX + tcX) / 2 + spread * 0.4;
              ly = midY;
            }
          }

          // Nudge label vertically if colliding with an already placed label
          for (let tries = 0; tries < 6; tries++) {
            const clash = placedLabels.some(p => Math.abs(p.x - lx) < 115 && Math.abs(p.y - ly) < 22);
            if (!clash) break;
            ly += (tries % 2 === 0 ? 22 : -22);
          }
          placedLabels.push({ x: lx, y: ly });

          paths.push(`<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${sw}" ${dash} stroke-opacity="${isExact ? 1 : 0.82}" marker-end="${markerFor(a.color, a.missing)}" />`);
          paths.push(`<circle cx="${(f.left + f.right)/2 - wRect.left}" cy="${(a.from === a.to ? f.top : (t.top > f.top ? f.bottom : f.top)) - wRect.top}" r="3" fill="${stroke}" />`);

          const countText = a.kind === 'junction' ? `${a.count}건` : `${a.matched}/${a.filled}`;
          labelsHtml.push(`
            <button type="button" class="arrow-label-btn ${isExact ? 'is-active' : ''}"
              style="left:${lx.toFixed(1)}px;top:${ly.toFixed(1)}px;--edge-color:${stroke}"
              data-select-arrow="${esc(a.id)}"
              title="${esc(a.from)}.${esc(a.fromCol)} → ${esc(a.to)}.${esc(a.toCol)}">
              <span>${esc(a.label)}</span>
              <small>${countText}</small>
            </button>`);
        });

        svg.innerHTML = defs + paths.join('');
        labelHost.innerHTML = labelsHtml.join('');

        labelHost.querySelectorAll('[data-select-arrow]').forEach(btn => {
          btn.onclick = () => {
            const id = btn.dataset.selectArrow;
            const arrow = allStats.find(a => a.id === id);
            if (state.selectedArrowId === id) {
              state.selectedArrowId = '';
              state.inspectTab = state.selectedTab;
            } else {
              state.selectedArrowId = id;
              state.inspectTab = arrow.kind === 'junction' ? arrow.viaTab : arrow.from;
            }
            state.pin = null;
            state.limit = 20;
            render();
          };
        });
      });
    }

    function getSheetSpec(tab) {
      return CORE_SHEETS.find(s => s.tab === tab);
    }

    function rowDisplayLabel(tab, row) {
      const spec = getSheetSpec(tab);
      if (spec) {
        const lbl = row[spec.labelCol];
        const pk = row[spec.pk];
        if (lbl && pk && lbl !== pk) return `${lbl} (${pk})`;
        return lbl || pk || '(값 없음)';
      }
      const vals = Object.values(row).filter(Boolean).slice(0, 3);
      return vals.join(' · ') || '(값 없음)';
    }

    const relationEndpointTabs = new Map([
      ['event', '사건'], ['category', '카테고리'],
      ...['actor', 'state', 'territory', 'organization', 'army', 'institution', 'person'].map(type => [type, '주체']),
    ]);

    function collectConnectedRowsBySheet(tab, origIdx, pkMaps) {
      const bySheet = new Map();
      const arrowIds = new Set();
      const row = state.data[tab][origIdx];

      function addHit(sheet, index, note = '', isOrigin = false) {
        if (index === undefined) return;
        if (!bySheet.has(sheet)) bySheet.set(sheet, new Map());
        const hits = bySheet.get(sheet);
        if (!hits.has(index)) hits.set(index, { origIdx: index, isOrigin, note });
      }

      addHit(tab, origIdx, '선택 행', true);
      if (!row) return { bySheet, arrowIds };

      for (const arrow of ARROWS) {
        if (arrow.kind === 'fk') {
          if (arrow.from === tab) {
            const target = pkMaps.get(arrow.to)?.get(row[arrow.fromCol]);
            if (target) {
              addHit(arrow.to, target.idx, arrow.label);
              arrowIds.add(arrow.id);
            }
          }
          if (arrow.to === tab && row[arrow.toCol]) {
            state.data[arrow.from].forEach((source, index) => {
              if (source[arrow.fromCol] !== row[arrow.toCol]) return;
              addHit(arrow.from, index, arrow.label);
              arrowIds.add(arrow.id);
            });
          }
          continue;
        }

        state.data[arrow.viaTab].forEach((link, index) => {
          if (tab === arrow.viaTab && index !== origIdx) return;
          if (arrow.viaTab !== '관계' && ![arrow.from, arrow.to, arrow.viaTab].includes(tab)) return;
          const ends = arrow.viaTab === '관계'
            ? ['출발', '도착'].map(side => {
              const type = link[side + '유형']?.trim().toLowerCase();
              return [relationEndpointTabs.get(type), link[side + 'ID']];
            })
            : [[arrow.from, link[arrow.viaFromCol]], [arrow.to, link[arrow.viaToCol]]];
          const endpoints = ends.map(([sheet, id]) => ({
            sheet, index: pkMaps.get(sheet)?.get(id)?.idx,
          }));
          const selected = tab === arrow.viaTab || endpoints.some(end => end.sheet === tab && end.index === origIdx);
          if (!selected) return;
          addHit(arrow.viaTab, index, arrow.label);
          for (const end of endpoints) addHit(end.sheet, end.index, arrow.label);
          if (ends.every(([sheet], i) => sheet === (i ? arrow.to : arrow.from))) arrowIds.add(arrow.id);
        });
      }
      return { bySheet, arrowIds };
    }

    const shapeTypeLabels = new Map([['', '전체'], ['point', '점'], ['line', '선'], ['area', '영역'], ['basemap', '배경지도']]);

    function renderInspector(allStats, pkMaps, tracedInfo, gq, globalHitsByTab) {
      const tab = state.inspectTab;
      const rows = state.data[tab] || [];
      const isShapes = tab === '지도도형';
      const shapeTypes = new Map(shapeTypeLabels);
      if (isShapes) {
        for (const {도형유형: type} of rows) {
          if (type && !shapeTypes.has(type)) shapeTypes.set(type, type);
        }
      }
      const hdrs = (state.headers[tab]?.length ? state.headers[tab] : Object.keys(rows[0] || {})).slice(0, 10);
      const selArrow = state.selectedArrowId ? allStats.find(a => a.id === state.selectedArrowId) : null;
      const relatedArrows = allStats.filter(a => a.from === state.selectedTab || a.to === state.selectedTab || a.viaTab === tab);

      // Build FK lookup for junction tables too!
      const fkColsForTab = new Map();
      for (const a of allStats) {
        if (a.kind === 'fk' && a.from === tab) fkColsForTab.set(a.fromCol, { to: a.to, toCol: a.toCol });
        if (a.kind === 'junction' && a.viaTab === tab) {
          fkColsForTab.set(a.viaFromCol, { to: a.from, toCol: a.fromCol });
          fkColsForTab.set(a.viaToCol, { to: a.to, toCol: a.toCol });
        }
      }

      const q = state.search.trim().toLowerCase();
      const matchingRows = gq ? new Set((globalHitsByTab.get(tab) || []).map(hit => hit.origIdx)) : null;
      const tracedRows = tracedInfo?.bySheet.get(tab);
      const filtered = [];
      rows.forEach((row, origIdx) => {
        if (tracedInfo) {
          if (tracedRows?.has(origIdx)) filtered.push({ row, origIdx });
          return;
        }
        if (matchingRows && !matchingRows.has(origIdx)) return;
        if (isShapes && state.shapeType && row.도형유형 !== state.shapeType) return;
        if (state.pin && state.pin.tab === tab && row[state.pin.col] !== state.pin.val) return;
        if (selArrow && selArrow.kind === 'fk' && selArrow.from === tab && !row[selArrow.fromCol]) return;
        if (q && !Object.values(row).some(v => String(v ?? '').toLowerCase().includes(q))) return;
        filtered.push({ row, origIdx });
      });
      const shown = filtered;

      document.getElementById('inspector').innerHTML = `
        <div class="ins-head">
          <div>
            <h2>

              <small style="color:var(--muted);font-weight:600">${rows.length.toLocaleString()}행</small>
            </h2>
            ${selArrow ? `<p class="ins-relation">${esc(selArrow.from)}.${esc(selArrow.fromCol)} → ${esc(selArrow.to)}.${esc(selArrow.toCol)}</p>` : ''}
          </div>
          <div class="sheet-tab-actions">
            ${fullSheetButton(tab)}
            <a class="btn btn-primary" href="${esc(sheetUrl(tab))}" target="_blank" rel="noopener noreferrer">시트에서 열기 ↗</a>
          </div>
        </div>

        <div class="rel-strip">
          ${relatedArrows.map(a => `
            <button type="button" class="rel-chip ${a.kind === 'junction' ? 'is-junction' : ''} ${state.selectedArrowId === a.id ? 'is-active' : ''}" data-chip-arrow="${esc(a.id)}" aria-pressed="${state.selectedArrowId === a.id}" title="${esc(a.from)}.${esc(a.fromCol)} → ${esc(a.to)}.${esc(a.toCol)}">
              <strong>${esc(a.label)}</strong>
              <small>(${a.kind === 'junction' ? a.count + '건' : a.matched + '/' + a.filled})</small>

        </div>

        ${state.pin && state.pin.tab === tab ? `
          <div class="pin-bar">
            <span>추적 중인 값: <strong>${esc(state.pin.tab)}.${esc(state.pin.col)} = ${esc(state.pin.val)}</strong></span>
            <button type="button" class="btn" id="btn-unpin">필터 해제</button>

        ${tracedInfo?.bySheet.size > 1 ? `<div class="trace-sheet-options" role="group" aria-label="직접 연결된 시트">
          ${[...tracedInfo.bySheet].map(([sheet, records]) => `<button type="button" class="btn" data-trace-sheet="${esc(sheet)}"
            aria-pressed="${sheet === tab}">${esc(sheet)} ${records.size}행</button>`).join('')}
        </div>` : ''}
        <div class="toolbar">
          ${isShapes && !tracedInfo ? `<div class="shape-type-options" role="group" aria-label="도형유형">
            ${[...shapeTypes].map(([type, label]) => `<button type="button" class="btn" data-shape-type="${esc(type)}"
              aria-pressed="${state.shapeType === type}">${esc(label)}</button>`).join('')}
          </div>` : ''}
          ${!tracedInfo ? `<input type="search" id="ins-search" class="search-box" aria-label="${esc(tab)} 시트 검색" placeholder="${esc(tab)} 시트 검색" value="${esc(state.search)}">` : ''}
          <span style="font-size:0.78rem;color:#64748b">${filtered.length.toLocaleString()}행</span>
        </div>

        <div class="live-table-wrap">
          <table class="live-table">
            <thead>
              <tr>
                <th>행</th>
                ${hdrs.map((h, i) => `<th><span style="color:#94a3b8;margin-right:4px">${colLetter(i)}</span>${esc(h)}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${shown.length ? shown.map(({ row, origIdx }) => {
                const rnum = origIdx + 2;
                return `
                  <tr class="${state.tracedRow && state.tracedRow.tab === tab && state.tracedRow.origIdx === origIdx ? 'is-traced' : ''}" data-click-row-tab="${esc(tab)}" data-click-row-idx="${origIdx}">
                    <td><a class="row-ext" href="${esc(sheetUrl(tab, rnum))}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">#${rnum} ↗</a></td>
                    ${hdrs.map(col => {
                      const val = row[col] || '';
                      const fk = fkColsForTab.get(col);
                      if (val && fk) {
                        const hit = pkMaps.get(fk.to)?.get(val);
                        const previewBtn = (fk.to === '지도도형') ? mapPreviewButton(val) : '';

      const idx = text.toLowerCase().indexOf(query);
      if (idx < 0) return safe;

    async function createFullSheetEventReader() {
      const [{ setupSwimlaneModal, sheetLeadership }, { buildSwimlane }] = await Promise.all([
        import('./assets/swimlane-modal.js'), import('./swimlane-data.js'),
      ]);
      const data = state.data;
      const events = data.사건.map((row, index) => ({ ...row, row: index + 2 }));
      const categoryLinks = state.headers.사건_카테고리.length
        ? data.사건_카테고리.map(row => ({ event_id: row.사건ID, topic_id: row.카테고리ID }))
        : undefined;
      const records = buildSwimlane({
        events, categoryLinks, categories: data.카테고리, actors: data.주체, relations: data.관계,
        participants: data.사건_주체, spaces: data.공간, eventSpaces: data.사건_공간,
        actorSpaces: data.주체_공간, categorySpaces: data.카테고리_공간,
      }, SheetData);
      return setupSwimlaneModal({
        ...records, packages: data.패키지, geography: data,
        leadership: sheetLeadership(data.주체, data.직위, data.재임),
      });
    }

    async function openFullSheetEvent(button) {
      pendingEventButton = button;
      fullSheetEventStatus.hidden = true;
      try {
        fullSheetEventReader ||= createFullSheetEventReader().catch(error => {
          fullSheetEventReader = null;
          throw error;
        });
        const reader = await fullSheetEventReader;
        if (pendingEventButton !== button || !fullSheetModal.open || !button.isConnected) return;
        button.focus({ preventScroll: true });
        reader.open('event', { id: button.dataset.sheetEventId });
      } catch (error) {
        if (pendingEventButton !== button || !fullSheetModal.open || !button.isConnected) return;
        console.error(error);
        fullSheetEventStatus.textContent = '사건 상세를 열지 못했습니다.';
        fullSheetEventStatus.hidden = false;
      }
    }

    function fullSheetEventRelations(rows) {
      const indexes = new Map();
      const columns = [];

      function matchingRows(sheet, column, key) {
        if (!key) return [];
        const indexKey = `${sheet}.${column}`;
        if (!indexes.has(indexKey)) {
          const index = new Map();
          for (const row of state.data[sheet]) {
            const value = row[column];
            if (!value) continue;
            if (!index.has(value)) index.set(value, []);
            index.get(value).push(row);
          }
          indexes.set(indexKey, index);
        }
        return indexes.get(indexKey).get(key) || [];
      }

      for (const arrow of ARROWS) {
        const { from, fromCol, to, toCol, viaTab, viaFromCol, viaToCol } = arrow;
        if (arrow.kind === 'junction' && from === '사건' && viaTab !== '관계') {
          columns.push({ label: to, values: row => matchingRows(viaTab, viaFromCol, row[fromCol]).flatMap(link =>
            matchingRows(to, toCol, link[viaToCol]).map(record => ({ sheet: to, record, note: link.역할 }))) });
        } else if (arrow.kind === 'fk' && to === '사건') {
          columns.push({ label: from, values: row => matchingRows(from, fromCol, row[toCol]).map(record => ({ sheet: from, record })) });
        }
      }

      for (const [side, opposite] of [['출발', '도착'], ['도착', '출발']]) {
        columns.push({ label: `관계 ${opposite}`, values: row =>
          matchingRows('관계', side + 'ID', row.사건ID).flatMap(link => {
            if (relationEndpointTabs.get(link[side + '유형']?.toLowerCase()) !== '사건') return [];
            const sheet = relationEndpointTabs.get(link[opposite + '유형']?.toLowerCase());
            if (!sheet) return [];
            return matchingRows(sheet, getSheetSpec(sheet).pk, link[opposite + 'ID'])
              .map(record => ({ sheet, record, note: link.라벨 || link.관계유형 }));
          }),
        });
      }

      return columns.map(({ label, values }) => ({ label, rows: rows.map(values) }))
        .filter(column => column.rows.some(values => values.length));
    }

    function fullSheetCell(value, rowIndex, columnIndex, hasMap) {
      if (hasMap) return `<td><div class="map-key-cell">${mapPreviewButton(value)}<span>${esc(value)}</span></div></td>`;
      if (value.length <= 120) return `<td>${esc(value || '—')}</td>`;
      return `<td><details data-sheet-row="${rowIndex}" data-sheet-column="${columnIndex}">
        <summary>${esc(value.slice(0, 100))}…</summary><pre class="full-sheet-value" tabindex="0"></pre>
      </details></td>`;
    }

    function fullSheetRelatedCell(values, mapKeys, first) {
      const items = new Set();
      for (const { sheet, record, note } of values) {
        let label = record[getSheetSpec(sheet).labelCol];
        if (sheet === '영토변화') {
          const dateRange = [record.시작일, record.종료일].filter(Boolean).join(' – ');
          label = [record.영토유형, dateRange].filter(Boolean).join(' · ');
        }
        const value = esc([label, note].filter(Boolean).join(' · ') || '—');
        const mapKey = record.지도참조키 || record.배경지도키;
        items.add(mapKeys.has(mapKey)
          ? `<div class="map-key-cell">${mapPreviewButton(mapKey)}<span>${value}</span></div>`
          : value);
      }
      const entries = [...items];
      const start = first ? ' data-related-start' : '';
      function list(values) {
        return `<ul class="full-sheet-values">${values.map(value => `<li>${value}</li>`).join('')}</ul>`;
      }
      if (entries.length <= 1) return `<td${start}>${entries[0] || '—'}</td>`;
      const more = entries.length > 3
        ? `<details><summary>+${entries.length - 3}개</summary>${list(entries.slice(3))}</details>`
        : '';
      return `<td${start}>${list(entries.slice(0, 3))}${more}</td>`;
    }

    function updateFullSheetFilter() {
      const selected = fullSheetSelections.get(fullSheetTab);
      const rowCount = state.data[fullSheetTab].length;
      const table = fullSheetScroll.querySelector('table');
      const columnCount = table.tHead.rows[0].cells.length - 1;
      const visible = fullSheetSelectedOnly ? selected.size : columnCount;
      const emptySelection = fullSheetSelectedOnly && selected.size === 0;
      if (!emptySelection) {
        for (const row of table.rows) {
          for (let index = 0; index < columnCount; index++) {
            row.cells[index + 1].hidden = fullSheetSelectedOnly && !selected.has(index);
          }
        }
      }
      table.hidden = emptySelection;
      fullSheetScroll.querySelector('[data-empty-selection]').hidden = !emptySelection;
      fullSheetScroll.querySelector('[data-empty-sheet]').hidden = emptySelection || rowCount > 0;
      fullSheetShowAll.setAttribute('aria-pressed', String(!fullSheetSelectedOnly));
      fullSheetShowSelected.setAttribute('aria-pressed', String(fullSheetSelectedOnly));
      fullSheetShowSelected.textContent = selected.size ? `선택한 열만 (${selected.size.toLocaleString()})` : '선택한 열만';
      document.getElementById('full-sheet-count').textContent = `${rowCount.toLocaleString()}행 · ${visible.toLocaleString()}열`;
    }

    function openFullSheet(tab) {
      fullSheetTab = tab;
      fullSheetSelectedOnly = false;
      fullSheetEventStatus.hidden = true;
      if (!fullSheetSelections.has(tab)) fullSheetSelections.set(tab, new Set());
      const selected = fullSheetSelections.get(tab);
      const rows = state.data[tab], headers = state.headers[tab];
      const related = tab === '사건' ? fullSheetEventRelations(rows) : [];
      const mapKeys = new Set(state.data.지도도형.map(row => row.지도참조키).filter(Boolean));
      document.getElementById('full-sheet-title').textContent = tab;
      document.getElementById('full-sheet-link').href = sheetUrl(tab);
      function columnHeader(name, index, isRelated, firstRelated = false) {
        return `<th scope="col"${isRelated ? ' data-related' : ''}${firstRelated ? ' data-related-start' : ''}>
          <label class="full-sheet-column-select"><input type="checkbox" data-sheet-select="${index}"
            aria-label="${esc(name)} 열 선택"${selected.has(index) ? ' checked' : ''}>${
              isRelated ? '' : `<small>${colLetter(index)}</small>`
            }${esc(name)}</label>
        </th>`;
      }
      const body = rows.map((row, rowIndex) => `<tr><th scope="row">${rowIndex + 2}</th>${
        headers.map((header, columnIndex) => {
          const value = row[header] || '';
          if (tab === '사건' && header === '사건명' && value && row.사건ID) {
            return `<td class="full-sheet-event-cell"><button type="button" data-sheet-event-id="${esc(row.사건ID)}"
              aria-haspopup="dialog">${esc(value)}</button></td>`;
          }
          return fullSheetCell(value, rowIndex, columnIndex, isMapKeyColumn(header) && mapKeys.has(value));
        }).join('')
      }${
        related.map((column, index) => fullSheetRelatedCell(column.rows[rowIndex], mapKeys, index === 0)).join('')
      }</tr>`).join('');
      fullSheetScroll.innerHTML = `<table class="full-sheet-table" aria-labelledby="full-sheet-title">
        <thead><tr><th scope="col">행</th>${
          headers.map((header, index) => columnHeader(header, index, false)).join('')
        }${
          related.map((column, index) => columnHeader(column.label, headers.length + index, true, index === 0)).join('')
        }</tr></thead>
        <tbody>${body}</tbody>
      </table>
      <p class="empty-td" data-empty-sheet hidden>표시할 시트 행이 없습니다.</p>
      <p class="empty-td" data-empty-selection hidden>선택한 열이 없습니다.</p>`;
      updateFullSheetFilter();
      fullSheetModal.showModal();
      fullSheetScroll.scrollTo(0, 0);
    }

    document.addEventListener('click', event => {
      const button = event.target.closest('button[data-open-full-sheet]');
      if (button) openFullSheet(button.dataset.openFullSheet);
    });
    fullSheetScroll.addEventListener('click', event => {
      const map = event.target.closest('button[data-preview-map-key]');
      if (map) openMapPreview(map.dataset.previewMapKey);
      const eventButton = event.target.closest('.full-sheet-event-cell')?.querySelector('button');
      if (eventButton) void openFullSheetEvent(eventButton);
    });
    fullSheetScroll.addEventListener('toggle', event => {
      const cell = event.target;
      if (!cell.matches('details[data-sheet-row]')) return;
      const row = state.data[fullSheetTab][cell.dataset.sheetRow];
      const column = state.headers[fullSheetTab][cell.dataset.sheetColumn];
      cell.querySelector('pre').textContent = cell.open ? row[column] : '';
    }, true);
    fullSheetScroll.addEventListener('change', event => {
      const checkbox = event.target;
      if (!checkbox.matches('input[data-sheet-select]')) return;
      const selected = fullSheetSelections.get(fullSheetTab);
      const index = Number(checkbox.dataset.sheetSelect);
      if (checkbox.checked) selected.add(index);
      else selected.delete(index);
      updateFullSheetFilter();
      if (fullSheetSelectedOnly && !checkbox.checked) fullSheetShowSelected.focus();
    });
    for (const button of [fullSheetShowAll, fullSheetShowSelected]) {
      button.addEventListener('click', () => {
        fullSheetSelectedOnly = button === fullSheetShowSelected;
        updateFullSheetFilter();
        fullSheetScroll.scrollLeft = 0;
      });
    }
    fullSheetModal.addEventListener('close', () => fullSheetScroll.replaceChildren());

    async function openMapPreview(mapKey){
      const modal=document.getElementById('map-preview-modal');
      const host=document.createElement('article');
      host.className='surface atlas';
      host.textContent='지도를 불러오는 중…';
      document.getElementById('map-preview-content').replaceChildren(host);
      const shapes=state.data['지도도형']||[];
      const index=shapes.findIndex(row=>row.지도참조키===mapKey);
      const link=document.getElementById('map-modal-sheet-link');
      link.hidden=index<0;
      if(index>=0)link.href=sheetUrl('지도도형',index+2);
      if(!modal.open)modal.showModal();
      try{
        const {renderShapePreview}=await import('./assets/record-atlas.js');
        await renderShapePreview(host,mapKey,{공간:state.data['공간']||[],지도도형:shapes});
      }catch(error){host.textContent=error.message||'지도를 불러오지 못했습니다.';}
    }
    document.getElementById('btn-close-map-modal').onclick = () => document.getElementById('map-preview-modal').close();
    document.getElementById('map-preview-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) e.currentTarget.close();
    });

    const gInput = document.getElementById('global-search-input');
    const searchBar = gInput.closest('.global-search-bar');
    const searchResults = document.getElementById('global-results');
    new ResizeObserver(() => {
      document.documentElement.style.scrollPaddingTop = `${searchBar.offsetHeight + 16}px`;
    }).observe(searchBar);
    gInput.addEventListener('input', e => {
      state.globalQuery = e.target.value;
      state.globalTabFilter = 'ALL';
      state.tracedRow = null;
      render();
      if (!searchResults.hidden && searchResults.getBoundingClientRect().top < searchBar.getBoundingClientRect().bottom) {
        searchResults.scrollIntoView({ block: 'start' });
      }
    });
    document.getElementById('btn-clear-global').onclick = () => {
      state.globalQuery = '';
      state.globalTabFilter = 'ALL';
      state.tracedRow = null;
      gInput.value = '';
      render();
      gInput.focus();
    };
    window.addEventListener('resize', () => render());
    loadAllSheets().then(()=>{
      const ref=new URLSearchParams(location.search).get('shape');
      if(ref)openMapPreview(ref);
    });
  </script>
</body>
</html>
