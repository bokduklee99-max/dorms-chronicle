<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일제 강점기 전체판 (교사용)</title>
<link rel="stylesheet" href="./japan-board.css">
<style>
:root{
  --bg:#FFFFFF; --text:#2E2B26; --sub:#6E6A62; --line:#D9D5CD;
  --gov:#B5483B;  --gov-t:#FBEEEB;
  --eco:#B07A1E;  --eco-t:#FCF4E4;
  --dom:#2F6FA3;  --dom-t:#EBF3FA;
  --man:#3A7C50;  --man-t:#EAF4ED;
  --chn:#6A4FA0;  --chn-t:#F2EEF9;
  --hot:#D0453C;
  --W:1920px; --H:1080px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E9E7E2;height:100%;overflow:hidden}
body{font-family:"Pretendard","Spoqa Han Sans Neo","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text)}
#stage{position:absolute;left:0;top:0;width:var(--W);height:var(--H);background:var(--bg);transform-origin:0 0;overflow:hidden}

/* 머리 */
.head{position:absolute;left:0;top:0;width:var(--W);height:54px;display:flex;align-items:center;padding:0 24px;gap:18px;border-bottom:2px solid var(--text)}
.head h1{font-size:28px;font-weight:800;letter-spacing:-.5px;white-space:nowrap}
.head .subt{font-size:15px;color:var(--sub);white-space:nowrap}
.legend{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:13px;color:var(--sub);white-space:nowrap}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.lg-band{width:34px;height:12px;border-radius:3px;background:rgba(46,43,38,.28)}
.lg-box{width:18px;height:14px;border:1.5px solid var(--text);border-radius:3px;background:#fff}
.lg-hot{width:18px;height:14px;border-radius:3px;background:var(--hot)}
.mode{font-size:13px;font-weight:700;padding:4px 10px;border-radius:12px;border:1.5px solid var(--text);cursor:pointer;background:#fff;user-select:none}

/* 시간축 */
.axis{position:absolute;left:0;top:54px;width:var(--W);height:64px}
.axis .rail{position:absolute;top:18px;height:4px;background:var(--text);border-radius:2px}
.tick{position:absolute;top:12px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:3px solid var(--text)}
.tyear{position:absolute;top:30px;transform:translateX(-50%);font-size:17px;font-weight:800}
.wev{position:absolute;top:0px;transform:translateX(-50%);font-size:11.5px;color:var(--sub);white-space:nowrap}
.wev.end{transform:translateX(-88%)}
.wev.major{top:49px;font-size:12.5px;font-weight:700;color:var(--hot)}
.wdot{position:absolute;top:17px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--sub)}
.guide{position:absolute;top:118px;bottom:0;border-left:1.5px dashed rgba(46,43,38,.16)}

/* 행 */
.row{position:absolute;left:0;width:var(--W)}
.row .lab{position:absolute;left:8px;top:4px;bottom:4px;width:88px;border-radius:8px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:19px;line-height:1.25;text-align:center}
.row .lab small{font-size:12px;font-weight:600;opacity:.85;margin-top:4px}
.row .bg{position:absolute;left:100px;right:6px;top:2px;bottom:2px;border-radius:8px}
.sep{position:absolute;left:100px;right:6px;height:0;border-top:2.5px solid var(--text)}
.sep span{position:absolute;left:0;top:-11px;background:var(--bg);padding:0 8px 0 0;font-size:13px;font-weight:800}

.r-gov .lab{background:var(--gov)} .r-gov .bg{background:var(--gov-t)}
.r-eco .lab{background:var(--eco)} .r-eco .bg{background:var(--eco-t)}
.r-dom .lab{background:var(--dom)} .r-dom .bg{background:var(--dom-t)}
.r-man .lab{background:var(--man)} .r-man .bg{background:var(--man-t)}
.r-chn .lab{background:var(--chn)} .r-chn .bg{background:var(--chn-t)}

/* 긴 하이라이트 */
.band{position:absolute;height:19px;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden}
.band .fill{flex:1;overflow:hidden;text-overflow:clip}
.band .yr{margin-left:6px;font-size:11px;font-weight:700;opacity:.85}
.band.period{height:26px;font-size:15.5px;font-weight:800;color:#fff;justify-content:center}
.band.period .fill{flex:none}
.band.period .yr{color:#fff}
.r-gov .band{background:rgba(181,72,59,.26);color:#6E241C}
.r-eco .band{background:rgba(176,122,30,.30);color:#5E3F0B}
.r-chn .band{background:rgba(106,79,160,.24);color:#3B2A63}
.r-gov .band.period,.r-chn .band.period{color:#fff}
.r-gov .band.p1{background:#7C3128}.r-gov .band.p2{background:#C0665A}.r-gov .band.p3{background:#4A1E19}
.r-chn .band.k1{background:#6A4FA0;color:#fff}.r-chn .band.k2{background:#9A86C4;color:#fff}.r-chn .band.k3{background:#4B3576;color:#fff}
.r-chn .band.k1 .yr,.r-chn .band.k2 .yr,.r-chn .band.k3 .yr{color:#fff}

/* 박스 */
.box{position:absolute;background:#fff;border:1.5px solid var(--c);border-radius:6px;padding:4px 7px 5px;font-size:12.5px;line-height:16.5px}
.r-gov .box{--c:var(--gov);--t:var(--gov-t)} .r-eco .box{--c:var(--eco);--t:var(--eco-t)}
.r-dom .box{--c:var(--dom);--t:var(--dom-t)} .r-man .box{--c:var(--man);--t:var(--man-t)}
.r-chn .box{--c:var(--chn);--t:var(--chn-t)}
.box .hd{display:flex;align-items:baseline;gap:6px;font-size:14px;line-height:19px;font-weight:800;color:var(--c);white-space:nowrap}
.box .hd .fill{flex:1}
.box .li{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.box .li .fill{flex:1}
.box .ln{white-space:nowrap;color:var(--text)}
.yr{font-size:11px;font-weight:700;color:var(--c);background:var(--t);border-radius:3px;padding:0 4px;line-height:15px;flex:none}
.box.list .hd{border-bottom:1px solid var(--line);margin-bottom:2px;padding-bottom:1px}
.box.key{border-width:2.5px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.box.key .hd{font-size:15.5px}
.box.hot{background:var(--hot);border-color:var(--hot)}
.box.hot .hd,.box.hot .ln{color:#fff}
.box.hot .yr{background:rgba(255,255,255,.25);color:#fff}
.box.chip .hd{font-size:13.5px}

/* 계열 칸 (민족주의·사회주의·연대·기타) */
.zone{position:absolute;border:2px dashed var(--zc);border-radius:10px;background:var(--zt)}
.zone .ztag{position:absolute;left:8px;top:-1px;transform:translateY(-50%);background:var(--zc);color:#fff;font-size:12.5px;font-weight:800;padding:1px 9px;border-radius:10px;white-space:nowrap}
.zone.nat{--zc:#3D6CB9;--zt:rgba(61,108,185,.07)}
.zone.soc{--zc:#D0731F;--zt:rgba(208,115,31,.08)}
.zone.uni{--zc:#A88414;--zt:rgba(233,196,70,.16)}
.zone.etc{--zc:#8A857B;--zt:rgba(138,133,123,.07)}
.box.nat{--c:#3D6CB9;--t:#E6EEF9}
.box.soc{--c:#D0731F;--t:#FCEBD9}
.box.uni{--c:#8A6D0B;--t:#FBF1CF}

/* 교사용 여백 메모(○) */
.note{position:absolute;font-size:11.5px;line-height:15px;color:var(--sub);font-style:italic;white-space:nowrap}
.note::before{content:"○ ";font-style:normal}

/* 화살표 */
#arrows{position:absolute;left:0;top:0;width:var(--W);height:var(--H);pointer-events:none;overflow:visible}
#arrows>path{fill:none;stroke:#57534B;stroke-width:1.6}
#arrows path.dash{stroke-dasharray:5 4}
#arrows text{font-size:11.5px;fill:#57534B;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px}

/* 학생용: 내용 비우기 (자리·크기 유지) */
.student .fill,.student .ln,.student .wev{color:transparent!important}
.student .box .fill,.student .box .ln{border-bottom:1px dashed #C9C4BA}
.student .box.hot .fill,.student .box.hot .ln{border-bottom-color:rgba(255,255,255,.6)}
.student .band:not(.period) .fill{border-bottom:1px dashed rgba(0,0,0,.25);height:13px}
.student .band.period .fill{min-width:120px;border-bottom:1.5px dashed rgba(255,255,255,.7);height:18px}
.student .note,.student #arrows text{display:none}
.student .wev.major{color:var(--hot)!important}

@media print{
  html,body{background:#fff;overflow:visible}
  #stage{transform:none!important}
  .mode{display:none}
}
@media print{@page{size:1920px 1080px;margin:0}}
</style>
</head>

/* 고정 한판 렌더러
   data_*.js가 정의하는 W,H,TITLE,SUBT,SEP_ROW,STOPS,ROWS,TICKS,WORLD,WORLD_MAJOR,DATA,ARROWS를 쓴다.
   band : 긴 하이라이트  {b:[from,to], y, label, yr, cls}
   box  : 박스          {id, x, y, w, hd, yr, ln:[...], cls}
   list : 목록 박스      {id, t:'list', x, y, w, hd, li:[[text, yr]], cls}
   note : 교사용 ○ 메모  {x, y, n}
   zone : 계열 칸       {z:[x,y,w,h], label, cls:'nat'|'soc'|'uni'|'etc', id}  — 박스보다 먼저 적는다
   ARROWS: [fromId, side, toId, side, {dash, label, at:[x,y], k}]  side = r|l|t|b|tr */
function X(y){
  for(let i=0;i<STOPS.length-1;i++){
    const [y0,x0]=STOPS[i],[y1,x1]=STOPS[i+1];
    if(y<=y1||i===STOPS.length-2) return Math.round(x0+(y-y0)*(x1-x0)/(y1-y0));
  }
}
const stage=document.getElementById('stage');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

document.documentElement.style.setProperty('--H',H+'px');

/* 시간축 */
const axis=document.getElementById('axis');
const first=TICKS[0], last=TICKS[TICKS.length-1];
axis.querySelector('.rail').style.cssText=`left:${X(first)}px;width:${X(last)-X(first)}px`;
TICKS.forEach(y=>{
  axis.insertAdjacentHTML('beforeend',`<div class="tick" style="left:${X(y)}px"></div><div class="tyear" style="left:${X(y)}px">${y}</div>`);
  if(y>first) stage.insertAdjacentHTML('beforeend',`<div class="guide" style="left:${X(y)}px"></div>`);
});
WORLD.forEach(([y,t])=>axis.insertAdjacentHTML('beforeend',`<div class="wdot" style="left:${X(y)}px"></div><div class="wev" data-board-key="axis:${esc(t)}" style="left:${X(y)}px">${t} (${y})</div>`));
WORLD_MAJOR.forEach(([y,t])=>axis.insertAdjacentHTML('beforeend',`<div class="wev major${y===last?' end':''}" data-board-key="axis:${esc(t)}" style="left:${X(y)}px">${t}</div>`));

/* 행 */
ROWS.forEach(r=>{
  const el=document.createElement('div');
  el.className='row '+r.cls; el.id='row-'+r.id;
  el.style.top=r.top+'px'; el.style.height=r.h+'px';
  el.innerHTML=`<div class="bg"></div><div class="lab">${r.lab}</div>`;
  (DATA[r.id]||[]).forEach((it,index)=>{
    const key=it.id||r.id+':'+index;
    let h='';
    if(it.z){
      const [zx,zy,zw,zh]=it.z;
      h=`<div class="zone ${it.cls||''}"${it.id?` id="${it.id}"`:''} style="left:${zx}px;top:${zy}px;width:${zw}px;height:${zh}px"><span class="ztag">${esc(it.label)}</span></div>`;
    }else if(it.b){
      const x0=X(it.b[0]),x1=X(it.b[1]);
      h=`<div class="band ${it.cls||''}" data-board-key="${key}" style="left:${x0}px;top:${it.y}px;width:${x1-x0}px"><span class="fill">${esc(it.label)}</span>${it.yr?`<span class="yr">${it.yr}</span>`:''}</div>`;
    }else if(it.n){
      h=`<div class="note" data-board-key="${key}" style="left:${it.x}px;top:${it.y}px">${esc(it.n)}</div>`;
    }else{
      const cls=['box',it.t==='list'?'list':'',it.cls||''].join(' ');
      h=`<div class="${cls}" id="${it.id}" style="left:${it.x}px;top:${it.y}px;width:${it.w}px">`
        +`<div class="hd" data-board-key="${key}"><span class="fill">${esc(it.hd)}</span>${it.yr?`<span class="yr">${it.yr}</span>`:''}</div>`
        +(it.ln||[]).map((l,i)=>`<div class="ln" data-board-key="${key}:${i}">${esc(l)}</div>`).join('')
        +(it.li||[]).map(([t,y],i)=>`<div class="li" data-board-key="${key}:${i}"><span class="fill">${esc(t)}</span>${y?`<span class="yr">${y}</span>`:''}</div>`).join('')
        +`</div>`;
    }
    el.insertAdjacentHTML('beforeend',h);
  });
  stage.insertBefore(el,document.getElementById('arrows'));
});
const sepRow=ROWS.find(r=>r.id===SEP_ROW);
if(sepRow) stage.insertAdjacentHTML('beforeend',`<div class="sep" style="top:${sepRow.top-5}px"><span>민족 독립운동</span></div>`);

/* 화살표 */
function anchor(id,side){
  const e=document.getElementById(id), row=e.parentElement;
  const x=e.offsetLeft, y=e.offsetTop+row.offsetTop, w=e.offsetWidth, h=e.offsetHeight;
  const [sd,f]=side.split(':'), q=f===undefined?0.5:+f;   /* 'l:0.3' = 왼쪽 변의 30% 지점 */
  return {r:[x+w,y+h*q],l:[x,y+h*q],t:[x+w*q,y],b:[x+w*q,y+h],tr:[x+w-16,y]}[sd];
}
function drawArrows(){
  const svg=document.getElementById('arrows');
  svg.querySelectorAll('path:not(marker path),text').forEach(n=>n.remove());
  ARROWS.forEach(([a,sa,b,sb,o={}])=>{
    const [x1,y1]=anchor(a,sa),[x2,y2]=anchor(b,sb);
    const k=o.k||Math.max(18,Math.min(80,Math.hypot(x2-x1,y2-y1)/3));
    const d={r:[k,0],l:[-k,0],t:[0,-k],b:[0,k],tr:[0,-k]}, da=d[sa.split(':')[0]], db=d[sb.split(':')[0]];
    const c1=[x1+da[0],y1+da[1]], c2=[x2+db[0],y2+db[1]];
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M${x1},${y1} C${c1} ${c2} ${x2},${y2}`);
    p.setAttribute('marker-end','url(#ah)');
    p.dataset.boardArrow=a+':'+b;
    if(o.dash) p.setAttribute('class','dash');
    svg.appendChild(p);
    if(o.label){
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      const m=p.getPointAtLength(p.getTotalLength()/2);
      const [tx,ty]=o.at||[m.x+5,m.y+4];
      t.setAttribute('x',tx); t.setAttribute('y',ty); t.textContent=o.label;
      svg.appendChild(t);
    }
  });
}

/* 화면 크기와 학생용 모드 */
const scroll=document.getElementById('board-scroll');
const layout=document.getElementById('board-size');
let enlarged=false;
function fit() {
  const scale=Math.min(scroll.clientWidth/W,scroll.clientHeight/H);
  const s=enlarged?Math.max(.65,scale):scale;
  layout.style.width=W*s+'px';
  layout.style.height=H*s+'px';
  stage.style.transform='scale('+s+')';
}
function selectMode(mode) {
  document.body.className=mode;
  for(const button of document.querySelectorAll('[data-mode]'))button.setAttribute('aria-pressed',String(button.dataset.mode===mode));
  document.dispatchEvent(new Event('board-mode-change'));
}
for(const button of document.querySelectorAll('[data-mode]'))button.onclick=()=>selectMode(button.dataset.mode);
for(const button of document.querySelectorAll('[data-zoom]'))button.onclick=()=>{
  enlarged=button.dataset.zoom==='zoom';
  for(const option of document.querySelectorAll('[data-zoom]'))option.setAttribute('aria-pressed',String(option===button));
  fit();
};
addEventListener('resize',fit);
fit();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{
  drawArrows();
  document.dispatchEvent(new Event('board-arrows-ready'));
