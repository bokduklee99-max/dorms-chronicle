<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사건 지도</title>
<link rel="stylesheet" href="./assets/cuba-story.css">
<script src="./assets/chronicle-frame.js"></script>
</head>
<body>
<header class="chronicle-header story-nav">
  <a class="chronicle-brand" data-standalone-header href="/">DoRms' Chronicle<span aria-hidden="true">✳</span></a>
  <nav class="chronicle-header-menu" aria-label="주요 메뉴"><a class="back" href="./event-map-demo.html">← 사건 지도</a></nav>
</header>
<main>
  <header>
    <div class="heading"><h1>사건 지도</h1><p></p></div>
  </header>
  <div class="layout">
    <section class="player" aria-label="쿠바 위기 지도 재생">
      <div class="map">
        <svg id="atlas" role="img" aria-label="쿠바와 카리브해 지도">
          <defs>
            <pattern id="hatch" width=".18" height=".18" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
              <path d="M0 0V.18" stroke="#fff0ae" stroke-width=".025" opacity=".36"/>
            </pattern>
          </defs>
          <g id="geography"><g id="world"></g><g id="regional"></g><g id="island"></g></g>
          <g id="grid"></g><g id="hotline"></g><g id="labels"></g>
        </svg>
        <aside id="dispatch" hidden><q></q><a target="_blank" rel="noopener noreferrer"></a></aside>
        <div class="locator" aria-hidden="true"><span>북</span>↑</div>
      </div>
      <div class="progress" aria-hidden="true"><i></i></div>
      <div class="caption" aria-live="polite" aria-atomic="true">
        <time id="date"></time><h2 id="scene-title">지도를 불러오는 중…</h2><p id="story-text"></p>
      </div>
      <div class="transport">
        <button id="play" disabled>▶ 재생</button>
        <button id="prev" aria-label="이전 장면" disabled>←</button>
        <button id="next" aria-label="다음 장면" disabled>→</button>
        <span id="counter"></span>
      </div>
    </section>
    <nav aria-label="쿠바 위기 사건 순서"><h2>사건 순서</h2><ol id="chapters"></ol></nav>
  </div>
  <footer><a href="https://docs.google.com/spreadsheets/d/1n3NFzBPos-c4QKu8r1UE3QwOngd0vK5Vf4pEXhnxGE0/edit#gid=201117001">원본 연표 ↗</a><span>지도 · <a href="https://icr.ethz.ch/data/cshapes/">CShapes 2.1</a> (<a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>) · <a href="https://www.naturalearthdata.com/">Natural Earth</a></span></footer>
  <noscript>사건 지도를 재생하려면 자바스크립트를 켜 주세요.</noscript>
</main>
<script src="./sheet-config.js?v=normalized-schema"></script><script src="./sheets.js?v=normalized-schema"></script>
<script type="module" src="./assets/cuba-story.js"></script>
</body>
</html>
