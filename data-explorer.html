<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <title>데이터 구조 · Dorms' Chronicle</title>
  <link rel="stylesheet" href="./assets/chronicle-theme.css">
  <link rel="stylesheet" href="./metro/assets/data-explorer.css?v=relation-counts">
  <link rel="stylesheet" href="./assets/space-preview.css?v=regional-atlas">
  <link rel="stylesheet" href="./data-explorer.css?v=showroom">
  <script defer src="./sheet-config.js?v=map-views"></script>
  <script defer src="./sheets.js?v=source-studio"></script>
  <script type="module" src="./metro/assets/data-explorer.js?v=showroom-2"></script>
</head>
<body class="chronicle-data">
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
  <header class="guide-nav">
    <div class="guide-nav-inner">
      <a class="wordmark" href="/">Dorms' Chronicle<span aria-hidden="true">✳</span></a>
      <nav aria-label="연표 데이터">
        <a id="structure-link" href="#structure" aria-current="page">데이터 구조</a>
        <a href="./sheet-schema-dashboard.html">시트 스키마</a>
        <a id="records-link" href="#overview">연표 편집</a>
        <a id="relation-editor-link" href="#event-relations">관계 편집</a>
        <a id="studio-link" href="#package-studio">패키지 제작실</a>
        <a id="examples-link" href="#examples">시각화 쇼룸</a>
      </nav>
      <a id="open-sheet" class="dashboard-button dashboard-primary" target="_blank" rel="noopener noreferrer">구글 시트 <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main id="main-content" tabindex="-1">
    <iframe id="studio-frame" title="패키지 제작실" hidden></iframe>
    <div class="dashboard-heading">
      <div class="dashboard-title">
        <nav id="table-breadcrumb" aria-label="현재 위치" hidden>
          <ol>
            <li><a href="#structure">데이터 구조</a></li>
            <li><span aria-hidden="true">›</span><a id="table-section-link"></a></li>
            <li><span aria-hidden="true">›</span><span id="table-current-page" aria-current="page"></span></li>
          </ol>
        </nav>
        <h1 id="page-title" tabindex="-1">데이터 구조</h1>
        <p id="sync-badge" role="status">시트를 불러오는 중이에요.</p>
      </div>
      <button id="btn-new-workspace-event" type="button" class="dashboard-button dashboard-primary" hidden><span aria-hidden="true">+</span> 새 사건</button>
      <div class="dashboard-actions dashboard-source-actions">
        <button id="btn-load-sheet" type="button" class="dashboard-button">시트 새로고침</button>
        <button id="btn-mobile-sidebar" type="button" class="dashboard-button lg:hidden" aria-controls="sidebar" aria-expanded="false" hidden>시트 목록</button>
      </div>
    </div>
    <div id="fallback-banner" class="dashboard-notice" hidden>
      <span id="source-message"></span>
      <button id="btn-retry-sync" type="button">다시 시도</button>
    </div>
    <div id="dirty-controls" class="dashboard-notice hidden">
      <span id="dirty-badge">브라우저 사본</span>
      <button id="btn-revert-changes" type="button">변경사항 되돌리기</button>
    </div>
    <div class="dashboard-layout">
      <nav id="structure-toc" class="dashboard-toc" aria-label="데이터 구조 목차">
        <a href="#structure-actors" aria-current="location">주체·지도자</a>
        <a href="#structure-catalog">패키지·사건</a>
        <a href="#structure-geography">공간·영토</a>
        <a href="#structure-relations">관계 유형</a>
      </nav>
      <button id="sidebar-backdrop" class="hidden lg:hidden fixed inset-0 z-30" type="button" tabindex="-1" aria-label="시트 목록 닫기"></button>
      <aside id="sidebar" class="dashboard-sidebar fixed lg:static inset-y-0 left-0 z-40 w-64 lg:w-auto transform -translate-x-full lg:translate-x-0 transition-transform" inert hidden>
        <div class="lg:hidden dashboard-sidebar-heading">
          <strong>시트 목록</strong>
          <button id="btn-close-sidebar" type="button" class="dashboard-button">닫기</button>
        </div>
        <nav id="sidebar-nav" class="space-y-5" aria-label="시트 목록"></nav>
        <div class="dashboard-file-actions">
          <button id="btn-json-export" type="button" class="dashboard-button">JSON 백업</button>
          <label class="dashboard-button">JSON 복원<input id="json-import-input" type="file" accept=".json" class="sr-only"></label>
          <label class="dashboard-button">CSV 불러오기<input id="csv-upload-input" type="file" accept=".csv" multiple class="sr-only"></label>
        </div>
      </aside>
      <div class="dashboard-content">
        <div id="table-tools" class="dashboard-tools" hidden>
          <header id="workspace-package-heading" class="workspace-block-heading" hidden>
            <h2>패키지</h2>
            <input class="workspace-search" id="package-search" type="search" aria-label="패키지 검색" placeholder="패키지 검색" autocomplete="off">
          </header>
          <div id="table-search" class="dashboard-search">
            <label for="global-search" class="sr-only">현재 시트 검색</label>
            <span class="dashboard-search-icon" aria-hidden="true"></span>
            <input id="global-search" type="search" placeholder="현재 시트 검색" autocomplete="off">
            <button id="btn-clear-search" type="button" class="dashboard-button" aria-label="검색 지우기" hidden><span class="dashboard-clear-label">검색 지우기</span><span class="dashboard-clear-icon" aria-hidden="true">×</span></button>
          </div>
          <div id="package-filter" class="dashboard-actions" role="group" aria-label="패키지"></div>
          <p id="package-search-empty" class="workspace-empty" hidden>검색 결과가 없습니다.</p>
        </div>
        <section id="workspace-categories" aria-label="카테고리 필터 및 편집" hidden>
          <header class="workspace-category-header">
            <div class="workspace-block-heading"><h2>카테고리</h2><input class="workspace-search" id="category-search" type="search" aria-label="카테고리 검색" placeholder="카테고리 검색" autocomplete="off"></div>
            <div class="dashboard-actions">
              <button type="button" class="dashboard-button" id="clear-category-filter" hidden>필터 해제</button>
              <button type="button" class="dashboard-button" id="edit-filtered-category" aria-haspopup="dialog" disabled>선택한 카테고리 편집</button>
            </div>
          </header>
          <div id="workspace-category-groups"></div>
          <p id="category-search-empty" class="workspace-empty" hidden>검색 결과가 없습니다.</p>
        </section>
        <div id="workspace-event-block">
          <header id="workspace-events-heading" class="workspace-block-heading" hidden><h2>사건 <span id="workspace-event-count"></span></h2></header>
          <div id="main-view" tabindex="-1"></div>
        </div>
      </div>
    </div>
    <noscript>데이터를 보려면 자바스크립트를 켜 주세요.</noscript>
    <section id="example-view" aria-labelledby="showroom-title" hidden>
      <header class="dashboard-heading"><div><h1 id="showroom-title">시각화 쇼룸</h1><p>냉전의 사건들을 세 가지 수업 화면으로 살펴보세요.</p></div></header>
      <nav id="showroom-views" aria-label="시각화 유형"></nav>
      <section id="showroom-exhibit" aria-labelledby="exhibit-title" hidden>
        <header><h2 id="exhibit-title" tabindex="-1"></h2><a id="showroom-open" target="_blank" rel="noreferrer">새 창에서 열기 ↗</a></header>
        <div id="showroom-stage"></div>
      </section>
    </section>
  </main>
  <dialog id="record-preview" aria-labelledby="record-preview-title">
    <header class="record-preview-header">
      <div>
        <p id="record-preview-kind" hidden></p>
        <h2 id="record-preview-title"></h2>
      </div>
      <form method="dialog"><button class="record-preview-close" aria-label="닫기" autofocus>×</button></form>
    </header>
    <div id="record-preview-body"></div>
    <footer class="record-preview-footer">
      <button id="btn-preview-edit" type="button" class="dashboard-button">브라우저 사본 편집</button>
    </footer>
  </dialog>
  <dialog id="edit-drawer" aria-labelledby="drawer-title">
    <div id="drawer-header" class="dashboard-drawer-header"></div>
    <div id="drawer-body" class="dashboard-drawer-body space-y-4"></div>
    <div id="drawer-footer" class="dashboard-drawer-footer"></div>
  </dialog>
  <dialog id="confirm-modal" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <form method="dialog" class="space-y-4">
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <div class="dashboard-actions">
        <button class="dashboard-button" value="no" autofocus>취소</button>
        <button class="dashboard-button dashboard-primary" value="yes">확인</button>
      </div>
    </form>
  </dialog>
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>
</body>
</html>
